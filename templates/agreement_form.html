<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agreement Form</title>
    <style>
        body {
            background-image: url('/images/earth.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            margin: 0;
            padding: 0;
            color: rgb(5, 26, 110)
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .top-actions {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .top-actions a {
            display: inline-block;
            padding: 10px 14px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
        }
        .top-actions a:hover { background-color: #0056b3; }

        #agreementForm {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        input[type="text"], input[type="email"], select, button {
            display: block;
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .checkbox-container {
            text-align: left;
        }

        .checkbox-container div {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .checkbox-container input[type="checkbox"] {
            margin-right: 10px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        h1 { 
            text-align: center; 
            font-size: 64px; 
            font-weight: bold; 
            margin-top: 40px;
            color: rgb(5, 26, 110); /* Dark blue center */
            text-shadow: 
                -1px -1px 0 #fff,  
                1px -1px 0 #fff,
                -1px 1px 0 #fff,
                1px 1px 0 #fff; /* White outline */
        }
    </style>
</head>
<body>
    <div class="logo">
        <img id="noaaLogo" src="" alt="NOAA Logo">
    </div>
    <div class="top-actions">
        <a id="statusLink" href="#" aria-label="View status">Status</a>
    </div>
    <h1>GitHub Request Form</h1>
    <form id="agreementForm">
        <input type="email" name="email" placeholder="Email" required>
        <input type="text" name="first_name" placeholder="First Name" required>
        <input type="text" name="last_name" placeholder="Last Name" required>
        <input type="text" name="github_username" placeholder="GitHub Username (associated with your NOAA email)" required maxlength="39" pattern="^[a-zA-Z0-9]([a-zA-Z0-9\-]{0,37}[a-zA-Z0-9])?$|^[a-zA-Z0-9]$" title="GitHub username: alphanumeric and hyphens only, cannot start or end with a hyphen, max 39 characters">
        
        <label for="esrl_lab">ESRL Laboratory:</label>
        <select name="esrl_lab" id="esrl_lab" required>            
            <option value="csl">CSL</option>
            <option value="gml">GML</option>
            <option value="gsl" selected>GSL</option>
            <option value="psl">PSL</option>
            <option value="tst">TST</option>
        </select>
        
        <label for="role">Anticipated Role:</label>
        <select name="role" required>
            <option value="Team Member">Team Member</option>
            <option value="Information Owner">Information Owner</option>
            <option value="Sponsor">Sponsor</option>
            <option value="GSL GitHub Account Administrator">Administrator</option>
            <option value="System Owner (SO)">System Owner - Doug Ohlhorst</option>
            <option value="Information System Security Officer (ISSO)">ISSO - Shannon M Johnston</option>
        </select>

        <label for="sponsor">Sponsor:</label>
        <select name="sponsor" id="sponsor" required>
            <!-- Options will be populated by JavaScript -->
        </select>

        <div class="checkbox-container">
            <div>
                <input type="checkbox" name="requirement1" id="requirement1" required>
                <label for="requirement1">
                    <a href="https://docs.google.com/document/d/1lCFyaoes64q7x23uGICeY1gQNdnGJE0dAFwS0wBDi9k/edit?usp=share_link" target="_blank">
                        Read and understand OAR's GitHub Usage Policy
                    </a>
                </label>
            </div>
            <div>
                <input type="checkbox" name="requirement4" id="requirement4" required>
                <label for="requirement4">
                    <a href="https://docs.google.com/document/d/1JuoRV9g2jOnbaGsy2EXJQ_8sPcSpYNEzqUqkvgghtp8/edit?tab=t.0" target="_blank">
                        Read the Onboarding Guide for GitHub Accounts
                    </a>
                </label>
            </div>
            <div>
                <input type="checkbox" name="requirement2" id="requirement2" required>
                <label for="requirement2"> Create a GitHub account using your NOAA email address</label>
            </div>
            <div>
                <input type="checkbox" name="requirement3" id="requirement3" required>
                <label for="requirement3">
                    <a href="https://sites.google.com/noaa.gov/gsl-staff-resources/its/yubikey-guidance" target="_blank">
                        Use two factor authentication with your GSL accounts
                    </a>
                    <br>
                    <a href="https://docs.github.com/en/authentication/securing-your-account-with-two-factor-authentication-2fa" target="_blank">
                        Enable two factor authentication on your GitHub account
                    </a>
                </label>
            </div>
        </div>
        
    <button type="submit">Submit</button>
        <div id="message"></div>
    </form>

    <script>
        let sponsorsByLab = {};

        const esrlLabSelect = document.getElementById('esrl_lab');
        const sponsorSelect = document.getElementById('sponsor');

        const basePrefix = window.location.pathname.includes('/githubapprovals')
                ? '/githubapprovals/'
                : '/';

            // Join helper that skips external URLs and prevents double slashes
        function withBase(p) {
            if (/^https?:\/\//i.test(p)) return p;        // external links untouched
            const clean = String(p).replace(/^\/+/, '');  // remove leading slashes
            return basePrefix + clean;
        }
    
        // Point static assets and internal links to correct base
        document.getElementById('noaaLogo').src = withBase('images/noaa_logo.png');
        document.getElementById('statusLink').href = withBase('status');
        // Override background image path to respect base
        document.body.style.backgroundImage = `url('${withBase('images/earth.jpg')}')`;

        const apiPath = withBase('api/lab_sponsors');
        const submitPath = withBase('/submit_agreement/');

        fetch(apiPath)
            .then(response => response.json())
            .then(data => {
                sponsorsByLab = data;
                populateSponsors(esrlLabSelect.value);
            });

        // Function to populate sponsors based on the selected lab
        function populateSponsors(selectedLab) {
            sponsorSelect.innerHTML = '';
            if (sponsorsByLab[selectedLab]) {
                sponsorsByLab[selectedLab].forEach(sponsor => {
                    const option = document.createElement('option');
                    option.value = sponsor.value;
                    option.textContent = sponsor.text;
                    sponsorSelect.appendChild(option);
                });
            }
        }

        // Populate sponsors on lab change
        esrlLabSelect.addEventListener('change', function() {
            populateSponsors(this.value);
        });

        document.getElementById('agreementForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const data = new URLSearchParams(formData);

            try {
                const response = await fetch(submitPath, {
                    method: 'POST',
                    body: data
                });

                const result = await response.json();
                if (response.ok) {
                    document.getElementById('message').innerText = result.message;
                    if (result.redirect_url) {
                        // Redirect to progress page (cache-bust param)
                        const bust = Date.now();
                        window.location.href = result.redirect_url + '?v=' + bust;
                        return;
                    }
                } else {
                    document.getElementById('message').innerText = result.detail;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('message').innerText = `An error occurred. Please try again later. Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
