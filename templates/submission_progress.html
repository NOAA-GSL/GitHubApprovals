<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submission Progress</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #0b2a55;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      padding: 30px 20px 10px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 2.2rem;
      font-weight: 600;
    }
    .name-highlight {
      color: #0b62d6;
      font-weight: 700;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .subtitle {
      text-align: center;
      margin-top: 4px;
      font-size: 0.95rem;
      color: #345;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .panel {
      background: rgba(255, 255, 255, 0.92);
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      max-width: 760px;
      width: 100%;
      text-align: center;
    }
    .gif-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 25px auto 10px;
      min-height: 260px;
    }
    .gif-wrapper img {
      max-width: 100%;
      height: auto;
      border: 3px solid #0b2a55;
      border-radius: 12px;
      background: #fff;
      display: none;
    }
    .progress-container {
      width: 100%;
      background: #e0e6ef;
      border-radius: 8px;
      overflow: hidden;
      height: 18px;
      margin: 10px 0 4px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.15);
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0b62d6, #33a1ff);
      transition: width .35s ease;
    }
    .progress-label {
      font-size: 0.75rem;
      color: #345;
      letter-spacing: 0.5px;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 4px solid #bcd2ea;
      border-top-color: #0b62d6;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .hidden { display: none !important; }
    .status-note {
      font-size: 0.9rem;
      color: #555;
      margin-top: 8px;
    }
    .actions {
      margin-top: 30px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .actions a {
      text-decoration: none;
      background: #0b62d6;
      color: #fff;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: 600;
      transition: background .2s;
    }
    .actions a.secondary { background: #607d8b; }
    .actions a:hover { background: #094fae; }
    footer {
      text-align: center;
      padding: 14px 10px;
      font-size: 0.75rem;
      color: #678;
    }
  </style>
</head>
<body>
  <header>
  <h1>Approval Progress for <span class="name-highlight">{{ full_name }}</span></h1>
    <div class="subtitle">Tracking current approval stages and status in real time.</div>
  </header>
  <main>
    <div class="panel">
      <div class="gif-wrapper" id="gifWrapper">
        <div id="loadingState">
          <div class="spinner" aria-label="Generating animation"></div>
          <div class="progress-container"><div id="progressBar" class="progress-bar"></div></div>
          <div id="progressLabel" class="progress-label">Preparing approval visualization...</div>
        </div>
        <img id="progressGif" alt="Progress Animation" />
      </div>
      <div class="status-note" id="statusNote">This page will update automatically when the animated approval path is ready.</div>
      <div class="actions">
        <a href="{{ base_path }}">Submit Another Request</a>
      </div>
    </div>
  </main>
  <footer>
    NOAA GSL GitHub Approvals &mdash; Automated Status Visualization
  </footer>
  <script>
    (function(){
      const email = '{{ email|default("") }}';
      const basePrefix = window.location.pathname.startsWith('/githubapprovals')
        ? '/githubapprovals/'
        : '/';
      const statusUrl = `${basePrefix}api/progress/${encodeURIComponent(email)}/status`;
      const triggerUrl = `${basePrefix}api/progress/${encodeURIComponent(email)}/generate`;
      const gifEl = document.getElementById('progressGif');
      const bar = document.getElementById('progressBar');
      const label = document.getElementById('progressLabel');
      const loadingState = document.getElementById('loadingState');
      const statusNote = document.getElementById('statusNote');

      let pollInterval = 1500;
      let started = false;

      async function triggerGeneration(){
        try { await fetch(triggerUrl, {method:'POST'}); } catch(e){ console.warn('Trigger failed', e); }
      }

      function setProgress(p){
        const clamped = Math.max(0, Math.min(100, p||0));
        bar.style.width = clamped + '%';
        label.textContent = `Generating visualization... ${clamped}%`;
      }

      async function poll(){
        try {
          const res = await fetch(statusUrl + '?t=' + Date.now());
          if(!res.ok) throw new Error(res.status);
          const data = await res.json();
          if(data.percent !== undefined) setProgress(data.percent);
          if(data.status === 'ready' && data.gif_url){
            loadingState.classList.add('hidden');
            gifEl.src = data.gif_url + '?v=' + Date.now();
            gifEl.style.display = 'block';
            statusNote.textContent = 'Visualization generated. Refresh later to capture new approvals.';
            return; // stop polling
          } else if(data.status === 'error') {
            loadingState.classList.add('hidden');
            statusNote.textContent = 'Error generating GIF: ' + (data.error || 'Unknown error');
            return;
          }
        } catch(err){
          console.warn('Poll error', err);
        }
        setTimeout(poll, pollInterval);
      }

      if(email){
        triggerGeneration();
        poll();
      } else {
        statusNote.textContent = 'No email context provided.';
      }
    })();
  </script>
</body>
</html>
